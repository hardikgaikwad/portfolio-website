services:
  - type: web
    name: hardik-portfolio-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://hardikgaikwad.vercel.app,https://*.vercel.app,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hardikgaikwad.vercel.app,https://*.vercel.app,https://*.onrender.com
    healthCheckPath: /api/health/

