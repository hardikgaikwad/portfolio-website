name: Backend Keep-Alive

on:
  schedule:
    # Runs every 14 minutes between 01:00 UTC and 19:30 UTC
    # Corresponds to 6:30 AM to 1:00 AM IST (18.5 hours/day)
    # ~573 hours/month (well inside Render's 750 free monthly hours, leaving a ~177 hour buffer)
    - cron: '*/14 1-19 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "Note: RENDER_BACKEND_URL secret is not set yet in GitHub Settings -> Secrets."
            echo "Set RENDER_BACKEND_URL to your Render URL (e.g. https://hardik-portfolio.onrender.com)."
            exit 0
          fi
          # Strip trailing slash if present
          CLEAN_URL="${BACKEND_URL%/}"
          echo "Pinging health endpoint at ${CLEAN_URL}/api/health/ ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "${CLEAN_URL}/api/health/")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Backend is healthy and Neon database query completed successfully!"
          else
            echo "Status returned: $HTTP_STATUS"
          fi
