<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/grid-paper-bg.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>HARDIK // Cybersecurity Engineer & Full-Stack Developer</title>
    <meta name="description" content="Personal portfolio and interactive terminal system of Hardik. Offensive security research, defensive architectures, and full-stack software development." />
    <meta name="keywords" content="cybersecurity, engineer, penetration testing, full stack developer, offensive security, terminal portfolio" />
    <meta name="author" content="Hardik" />

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Script (Starts in Light Mode by default) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
